<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RN Assignment Worksheet</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
#calculator { margin-bottom: 20px; }
#calculator label { margin-right: 5px; }
#calculator input { width: 60px; padding: 3px; margin-right: 10px; }
#nurseResult { font-weight: bold; }
button { padding: 8px 12px; margin: 5px; cursor: pointer; }
.modeBtn.active, .labelBtn.active { background-color: #4CAF50; color: white; }
.diagram-container {
  display: grid;
  grid-template-columns: repeat(6, 100px);
  grid-template-rows: repeat(9, 100px);
  gap: 10px;
  position: relative;
  border: 1px solid #ccc;
  padding: 20px;
  margin-top: 20px;
  justify-content: center;
}
.room {
  border: 2px solid #333;
  text-align: center;
  line-height: 100px;
  cursor: pointer;
  position: relative;
  background-color: white;
  overflow: hidden;
}
.room.single { background-color: green; color: white; border-radius: 50%; }
.room.empty { background-color: red; color: white; }
.room.blocked { background-color: gray; color: white; clip-path: polygon(50% 0%,0% 100%,100% 100%); }
.room.assigned.double, .room.assigned.float { border: none !important; }
.room.selected { border-color: orange; }
.diagram-svg {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;
}
.room-number { position: absolute; width: 100%; height: 100%; display:flex; align-items:center; justify-content:center; font-size:2em; pointer-events:none; }
.room-labels { position:absolute; bottom:2px; right:2px; display:flex; flex-wrap: wrap; gap:2px; pointer-events:none; }
.room-label { font-size: 0.7em; background: rgba(200,200,200,0.9); padding: 2px 4px; border-radius:3px; }
</style>
</head>
<body>
<h1>RN Assignment Worksheet</h1>

<div id="calculator">
  <label for="numAssignments">Number of Assignments:</label>
  <input type="number" id="numAssignments" min="0" oninput="calculateAssignments()">
  <label for="maxCapacity">Max Capacity:</label>
  <input type="number" id="maxCapacity" min="0" value="18" oninput="calculateAssignments()">
  <span id="nurseResult"></span>
</div>

<button id="toggleMode" class="modeBtn active">Mode: Blocked (Click to switch)</button>
<button id="resetPairsBtn">Reset Pairs</button>

<div id="labelButtons">
  <button class="labelBtn" data-label="OR">OR</button>
  <button class="labelBtn" data-label="WR">WR</button>
  <button class="labelBtn" data-label="Pediatric">Pediatric</button>
  <button class="labelBtn" data-label="Floor Boarder">Floor Boarder</button>
</div>

<div id="customLabelDiv">
  <input type="text" id="customLabelInput" placeholder="Custom Label">
  <button id="customLabelBtn" class="labelBtn">Custom</button>
</div>

<div class="diagram-container" id="diagramContainer">
  <svg class="diagram-svg" id="diagramSVG"></svg>
</div>

<script>
function calculateAssignments() {
  var numAssignments = parseInt(document.getElementById("numAssignments").value);
  var maxCapacity = parseInt(document.getElementById("maxCapacity").value);
  if(isNaN(numAssignments) || isNaN(maxCapacity)){ document.getElementById("nurseResult").textContent = ""; return; }
  var y = maxCapacity - numAssignments;
  var x = numAssignments - y;
  if(x<0 || y<0){ document.getElementById("nurseResult").textContent="Invalid input."; return; }
  document.getElementById("nurseResult").textContent = "# of Singles: "+x+", # of Doubles: "+y;
}

var modes = ["blocked","empty","single","float","double"];
var modeIndex = 0;
var currentMode = modes[modeIndex];
document.getElementById("toggleMode").addEventListener("click",function(){
  modeIndex = (modeIndex+1)%modes.length;
  currentMode = modes[modeIndex];
  this.textContent = "Mode: " + currentMode.charAt(0).toUpperCase()+currentMode.slice(1)+" (Click to switch)";
});

var roomLayout = [
  {label:"5",row:1,col:2},{label:"6",row:1,col:3},{label:"7",row:1,col:4},{label:"8",row:1,col:5},
  {label:"4",row:2,col:1},{label:"9",row:2,col:6},{label:"3",row:3,col:1},{label:"10",row:3,col:6},
  {label:"2",row:4,col:1},{label:"11",row:4,col:6},{label:"1",row:5,col:1},{label:"12",row:5,col:6},
  {label:"13",row:6,col:6},{label:"14",row:7,col:6},{label:"15",row:8,col:6},{label:"18",row:9,col:3},
  {label:"17",row:9,col:4},{label:"16",row:9,col:5}
];

var currentLabel = "";
var isLabelActive = false;
var doublePairs = [], floatPairs = [], doubleLabels = [], floatLabels = [];

function generateUnitDiagram(){
  var container = document.getElementById("diagramContainer");
  container.querySelectorAll(".room").forEach(r=>r.remove());
  roomLayout.forEach(function(roomObj){
    var roomDiv = document.createElement("div");
    roomDiv.className="room";
    roomDiv.style.gridRow = roomObj.row;
    roomDiv.style.gridColumn = roomObj.col;
    roomDiv.dataset.roomId = roomObj.label;

    var roomNum = document.createElement("div");
    roomNum.className="room-number";
    roomNum.textContent = roomObj.label;
    roomDiv.appendChild(roomNum);

    var labelsContainer = document.createElement("div");
    labelsContainer.className="room-labels";
    roomDiv.appendChild(labelsContainer);

    roomDiv.addEventListener("click",function(){
      if(isLabelActive && currentLabel){
        var labelText = currentLabel;
        if(labelText==="Pediatric") labelText="P";
        if(labelText==="Floor Boarder") labelText="FB";
        var existing = Array.from(labelsContainer.children).find(c=>c.textContent===labelText);
        if(existing){ existing.remove(); }
        else { var span=document.createElement("span"); span.className="room-label"; span.textContent=labelText; labelsContainer.appendChild(span); }
        return;
      }

      if(this.classList.contains(currentMode)){
        this.classList.remove("assigned",currentMode);
        return;
      }
      this.classList.add("assigned",currentMode);

      if(currentMode==="double" || currentMode==="float"){
        this.classList.add("selected");
        var selectedRooms = document.querySelectorAll(".room.selected");
        if(selectedRooms.length===2){
          selectedRooms.forEach(r=>{ r.classList.remove("selected"); r.classList.add("assigned",currentMode); });
          if(currentMode==="double"){ doublePairs.push([selectedRooms[0],selectedRooms[1]]); var lbl=prompt("Enter label for this Double pair:","")||("D"+doublePairs.length); doubleLabels.push(lbl); }
          else { floatPairs.push([selectedRooms[0],selectedRooms[1]]); floatLabels.push("F"+floatPairs.length); }
          updatePairLines();
        }
      }
    });
    container.appendChild(roomDiv);
  });
}

document.querySelectorAll(".labelBtn").forEach(function(btn){
  btn.addEventListener("click",function(){
    var label = btn.getAttribute("data-label");
    if(currentLabel===label){ currentLabel=""; isLabelActive=false; btn.classList.remove("active"); }
    else{ currentLabel=label; isLabelActive=true; document.querySelectorAll(".labelBtn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); }
  });
});
document.getElementById("customLabelBtn").addEventListener("click",function(){
  var input=document.getElementById("customLabelInput").value.trim();
  if(input){
    if(currentLabel===input){ currentLabel=""; isLabelActive=false; this.classList.remove("active"); }
    else{ currentLabel=input; isLabelActive=true; document.querySelectorAll(".labelBtn").forEach(b=>b.classList.remove("active")); this.classList.add("active"); }
  }
});

document.getElementById("resetPairsBtn").addEventListener("click",function(){
  document.querySelectorAll(".room.double,.room.float").forEach(r=>{ r.classList.remove("assigned","double","float"); });
  doublePairs=[]; floatPairs=[]; doubleLabels=[]; floatLabels=[];
  updatePairLines();
});

function getAttachmentPoint(roomEl){
  var rect = roomEl.getBoundingClientRect();
  return {x: rect.left + rect.width/2, y: rect.top + rect.height/2};
}

function updatePairLines(){
  var svg = document.getElementById("diagramSVG"); svg.innerHTML="";
  var containerRect = document.getElementById("diagramContainer").getBoundingClientRect();
  var centerX = containerRect.width/2;
  var centerY = containerRect.height/2;
  var offset = 160; // doubled amplitude
  function drawArch(pair,dashed,color,label){
    if(!pair[0]||!pair[1]) return;
    var r1 = getAttachmentPoint(pair[0]), r2 = getAttachmentPoint(pair[1]);
    var x1 = r1.x - containerRect.left, y1 = r1.y - containerRect.top;
    var x2 = r2.x - containerRect.left, y2 = r2.y - containerRect.top;
    var midX = (x1+x2)/2, midY = (y1+y2)/2;
    var dx = x2 - x1, dy = y2 - y1;
    var cx, cy;
    if(Math.abs(dx) > Math.abs(dy)){
      cy = midY + (midY<centerY? offset : -offset);
      cx = midX;
    } else {
      cx = midX + (midX<centerX? offset : -offset);
      cy = midY;
    }
    var path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
    path.setAttribute("stroke",color); path.setAttribute("stroke-width","4"); path.setAttribute("fill","none");
    if(dashed) path.setAttribute("stroke-dasharray","10,6");
    svg.appendChild(path);
    if(label){
      var text=document.createElementNS("http://www.w3.org/2000/svg","text");
      text.setAttribute("x",cx); text.setAttribute("y",cy-10); text.setAttribute("fill",color);
      text.setAttribute("text-anchor","middle"); text.textContent=label;
      svg.appendChild(text);
    }
  }
  doublePairs.forEach((p,i)=>drawArch(p,false,"#0074D9",doubleLabels[i]));
  floatPairs.forEach((p,i)=>drawArch(p,true,"#9b59b6",floatLabels[i]));
}

window.onload=function(){ generateUnitDiagram(); calculateAssignments(); };
</script>
</body>
</html>
